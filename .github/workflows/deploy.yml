name: Vault Automated Deployment

on:
  push:
    branches:
      - main 

jobs:
  deploy-to-aws:
    runs-on: ubuntu-latest
    
    steps:
      # Step A: GitHub gets your latest code
      - name: Checkout Latest Code
        uses: actions/checkout@v4

      # Step B: THE FIX - Use sudo to destroy the old root-locked files
      - name: Clean Old Root Files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo rm -rf /home/ubuntu/VAULT
            mkdir -p /home/ubuntu/VAULT
            sudo chown -R ubuntu:ubuntu /home/ubuntu/VAULT

      # Step C: Securely copy the files (rm is now false since we just cleaned it)
      - name: Copy Files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/VAULT"
          rm: false 

      # Step D: Log into AWS, inject IPs, and build Docker
      - name: Execute Docker Compose on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/VAULT
            
            # Fix the Windows node_modules permission bug
            echo "node_modules" | sudo tee vault-ui/.dockerignore > /dev/null
            
            # Inject your AWS IP into the frontend
            echo "VITE_API_URL=http://${{ secrets.AWS_HOST }}:3000" | sudo tee vault-ui/.env > /dev/null
            
            # Restart the Docker Engine
            sudo docker compose up -d --build